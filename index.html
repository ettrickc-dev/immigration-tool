<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Find Your Immigration Options | EasyLegalFiling</title>

<link rel="icon" href="favicon.ico">

  n.async=!0,n.src="https://analytics.tiktok.com/i18n/pixel/events.js";

<style>
body{margin:0;font-family:Arial;background:#f8fafc;color:#0f172a}
.header{background:#0f172a;color:white;text-align:center;padding:20px}
.logo{height:50px;margin-bottom:10px}
.container{max-width:700px;margin:auto;padding:20px}
.card{background:white;padding:20px;border-radius:12px;margin-bottom:15px;border:1px solid #e2e8f0}
input,select{width:100%;padding:12px;margin-bottom:10px;border-radius:8px;border:1px solid #ccc}
button{background:#2563eb;color:white;padding:15px;border:none;border-radius:10px;width:100%;font-weight:bold;font-size:16px;cursor:pointer}
.cta{display:block;text-align:center;background:#22c55e;color:white;padding:15px;border-radius:10px;margin-top:10px;text-decoration:none;font-weight:bold}
.warning{color:#dc2626;font-weight:bold;margin-top:10px}
.score{font-size:18px;font-weight:bold;margin-top:10px}
</style>
</head>

<body>

<div class="header">
<img src="logo.png" class="logo">
<h1>Find Your Immigration Options</h1>
<p>Answer a few quick questions — see what may work for you</p>
</div>

<div class="container">

<div class="card">

<label>What are you trying to do?</label>
<select id="goal">
<option>Get a green card / stay permanently</option>
<option>Avoid deportation / fix my case</option>
<option>Work legally</option>
<option>Bring a family member</option>
<option>Apply for asylum</option>
<option>Not sure — I just need help</option>
</select>

<label>Which best describes your situation?</label>
<select id="status">
<option>I don’t have legal status right now</option>
<option>I had a visa but stayed longer than allowed</option>
<option>I currently have valid status</option>
<option>I have a green card</option>
<option>I am already in immigration court</option>
<option>I’m not sure</option>
</select>

<label>How did you enter the U.S.?</label>
<select id="entry">
<option>I came with a visa / spoke to an officer</option>
<option>I entered without inspection</option>
<option>I’m not sure</option>
</select>

<label>Do any of these apply to you?</label>
<select id="family">
<option>None</option>
<option>Married to a U.S. citizen</option>
<option>Have a U.S. citizen child</option>
<option>Have a green card holder spouse</option>
<option>Other family situation</option>
</select>

<label>Do any of these situations apply?</label>
<select id="special">
<option>None</option>
<option>I was abused by a spouse/parent (VAWA)</option>
<option>I am afraid to return to my country</option>
<option>I was a victim of a crime</option>
<option>Something else serious happened</option>
</select>

<label>Anything else we should know?</label>
<select id="risk">
<option>None</option>
<option>I missed court before</option>
<option>I have a criminal record</option>
<option>I used false information before</option>
<option>I was deported before</option>
</select>

<button onclick="run()">See My Results</button>

</div>

<div id="results"></div>

</div>

<script>

function run(){

ttq.track('SubmitForm');

let score=0;
let html="<div class='card'><h3>Your Results</h3>";

let goal=document.getElementById("goal").value;
let entry=document.getElementById("entry").value;
let family=document.getElementById("family").value;
let special=document.getElementById("special").value;
let status=document.getElementById("status").value;
let risk=document.getElementById("risk").value;

/* LOGIC */

if(family.includes("U.S. citizen") && entry.includes("visa")){
score+=3;
html+="<p><b>You may qualify for a marriage/family-based green card</b></p>";
}

if(entry.includes("without inspection")){
score+=2;
html+="<p><b>You may need a waiver or consular process</b></p>";
}

if(special.includes("abused")){
score+=3;
html+="<p><b>VAWA may apply (self-petition)</b></p>";
}

if(special.includes("afraid")){
score+=3;
html+="<p><b>Asylum may be an option</b></p>";
}

if(special.includes("crime")){
score+=3;
html+="<p><b>You may qualify for a U Visa</b></p>";
}

if(status.includes("court") || goal.includes("deportation")){
score+=3;
html+="<p><b>You should focus on fixing your immigration court case first</b></p>";
}

/* SCORE */

if(score>=6){
html+="<div class='score' style='color:#16a34a'>Strong possible options</div>";
}else if(score>=3){
html+="<div class='score' style='color:#f59e0b'>Possible options to explore</div>";
}else{
html+="<div class='score' style='color:#dc2626'>Your case needs more review</div>";
}

/* URGENCY */

if(status.includes("court")){
html+="<p class='warning'>⚠️ You are in court — timing matters</p>";
}

if(risk!=="None"){
html+="<p class='warning'>⚠️ Your situation has risk factors — do not guess</p>";
}

/* HIGH CONVERSION CTA */

html+=`
<p><b>Most people in your situation take the next step now to avoid mistakes.</b></p>

<a class="cta" href="https://easylegalfiling.com">
Get My Full Step-by-Step Plan
</a>

<a class="cta" href="https://easydivorcefiling.gavel.io/portal/bundles/1fdc878f-a324-489a-bc6a-272f3e973196">
Fix My Case Now
</a>

<div style="margin-top:20px;padding:15px;border:1px solid #e2e8f0;border-radius:10px;">
<b>Want help later?</b>
<form action="https://formsubmit.co/ettrickc@gmail.com" method="POST">
<input type="hidden" name="_subject" value="Immigration Tool Lead">
<input type="email" name="email" placeholder="Enter your email (optional)">
<button type="submit">Send me this</button>
</form>
</div>
`;

html+="</div>";

document.getElementById("results").innerHTML=html;

}
</script>

</body>
</html>
